<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>domonic Declarative Shadow DOM</title><style>
            body {
                margin: 2rem;

            </style></head><body><profile-card><template shadowrootmode="open"><style>
            :host {
                display: block;
